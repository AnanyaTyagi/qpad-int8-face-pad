# INT8 calibration-composition experiment (Priority 1/2; not part of Checkpoint 1 critical path).

calibration_budget:
  videos: 120
  frames_per_video: 5
  images: 600

# Pre-registered primary calibration method. Changing it requires a written justification.
calibration_method:
  primary: entropy               # TensorRT IInt8EntropyCalibrator2 (implicit quantization)
  sensitivity: minmax            # planned sensitivity analysis only (IInt8MinMaxCalibrator)
  calibration_batch_size: 20

conditions:
  natural:         {bona_fide: 40, print: 40, replay: 40}
  class_balanced:  {bona_fide: 60, print: 30, replay: 30}
  bona_fide_heavy: {bona_fide: 80, print: 20, replay: 20}
  print_heavy:     {bona_fide: 40, print: 60, replay: 20}
  replay_heavy:    {bona_fide: 40, print: 20, replay: 60}
  no_print:        {bona_fide: 40, print: 0,  replay: 80}
  no_replay:       {bona_fide: 40, print: 80, replay: 0}

reference_condition: natural

seeds:
  full: [1, 2, 3, 4, 5]
  pilot: [1, 2]

pilot_conditions: [natural, no_print, no_replay]

tensorrt:
  # Pinned for every engine (06-10). TensorRT 11 removed IInt8EntropyCalibrator2 (implicit quantization),
  # which the pre-registered entropy method needs; 10.16.1.11 is the last 10.x release (2026-10-28).
  version: "10.16.1.11"
  workspace_gb: 4
  opt_batch: 20
  max_batch: 64
  min_batch: 1
  onnx_opset: 17

export_tolerances:
  pytorch_vs_onnx_max_abs: 1.0e-5
  onnx_vs_trt_fp32_max_abs: 1.0e-4

# Pilot diagnostics (notebook 07c): rebuilds of natural seed 1 with per-layer profiling, and two deliberately
# extreme calibration sets for seed 1 (positive controls: can the pipeline show a calibration effect at all?).
diagnostics:
  rebuild_repeats: 3
  controls:
    bona_fide_only: {bona_fide: 120, print: 0, replay: 0}
    tiny_natural:   {bona_fide: 2, print: 1, replay: 1}     # 4 videos x 5 frames = 20 images = one batch

# One-factor ablation (notebooks 08 and 08b), replacing the 35-engine design after the pilot review:
# change one thing at a time from natural (600 images, 67% attack images) and find where results get worse.
# Videos per class, 5 frames each. Within a seed the sets are nested (smaller = prefix of larger).
ablation:
  seeds: [1, 2, 3]
  baseline: natural
  settings:
    natural:   {bona_fide: 40,  print: 40, replay: 40}   # 600 images, 67% attack (same mix as the pilot)
    attack40:  {bona_fide: 72,  print: 24, replay: 24}   # 600 images, 40% attack
    attack20:  {bona_fide: 96,  print: 12, replay: 12}   # 600 images, 20% attack
    attack10:  {bona_fide: 108, print: 6,  replay: 6}    # 600 images, 10% attack
    attack0:   {bona_fide: 120, print: 0,  replay: 0}    # 600 images, 0% attack (s1 = 07c bona_fide_only)
    images200: {bona_fide: 13,  print: 14, replay: 13}   # 200 images, 67.5% attack (40 videos cannot split 1:1:1)
    images60:  {bona_fide: 4,   print: 4,  replay: 4}    # 60 images, 67% attack
    images20:  {bona_fide: 2,   print: 1,  replay: 1}    # 20 images, 50% attack (4 videos; s1 = 07c tiny_natural)
  lines:
    attack_share: [natural, attack40, attack20, attack10, attack0]
    images: [natural, images200, images60, images20]
  # Threshold rules reported for every engine: A = fixed FP32 threshold, B = engine's own dev EER (kept for
  # comparison), C = engine's own dev threshold that rejects at most this share of dev bona fide videos.
  bpcer_targets: [0.10, 0.15]

rebuild_noise:
  condition: natural
  seed: 1
  repeats: 3
  max_metric_variation_pp: 0.5

statistics:
  meaningful_effect_pp: 5.0
  min_seeds_exceeding: 4        # of 5, for a bias claim
  robust_max_seeds_exceeding: 1 # fewer than two seeds exceed the effect size
  auroc_score_shift_tolerance: 0.01
  bootstrap_reps: 10000
  bootstrap_seed: 20261016
  ci_level: 0.95
  permutation_alternative: two-sided
  permutation_max_exact_subjects: 20
  permutation_monte_carlo: 100000
  alpha: 0.05

latency:
  batch_sizes: [1, 20]
  warmup_iterations: 200
  measured_iterations: 2000
